<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PasswordMan</title>
  <script type="module" src="/main.js" defer></script>
</head>

<body>
  <div class="header">
    <h2>PasswordMan</h2>
    <div>
      <button id="theme-toggle" title="Switch Theme" class="action-btn">
        <img src="assets/solar--sun-2-line-duotone.svg" alt="Switch Theme">
      </button>
      <button id="settings-btn" title="System Settings" class="action-btn" style="margin-left: 10px;">
        <img src="assets/solar--tuning-broken.svg" alt="Settings">
      </button>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="search-input" placeholder="输入密码名称关键词查询" />
    <button id="add-btn" title="Add Password">+</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>密码名称</th>
          <th>用户名</th>
          <th>密码</th>
          <th>备注</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="password-list">
        <!-- Rows will be injected here -->
      </tbody>
    </table>
  </div>

  <!-- Modal for Add/Edit -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">添加密码</h3>
      <input type="hidden" id="modal-id" />

      <label>密码名称</label>
      <input type="text" id="modal-name" required />

      <label>用户名</label>
      <input type="text" id="modal-username" />

      <label>密码</label>
      <div class="password-input-group">
        <input type="text" id="modal-password" required />
        <button id="modal-gen-pwd" type="button" title="Generate">🎲</button>
      </div>

      <label>备注</label>
      <textarea id="modal-note"></textarea>

      <div class="modal-actions">
        <button id="modal-cancel">取消</button>
        <button id="modal-save" class="primary">保存</button>
      </div>
    </div>
  </div>

  <!-- Modal for Settings -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h3>系统设置</h3>

      <div class="settings-section">
        <h4>安全设置</h4>
        <p class="settings-desc">设置主密码以保护您的数据库文件。</p>

        <div id="settings-no-pass" class="hidden">
          <button id="btn-set-pass" class="primary" style="width: 100%">启用密码保护</button>
        </div>

        <div id="settings-has-pass" class="hidden">
          <button id="btn-change-pass" style="width: 100%; margin-bottom: 10px;">修改主密码</button>
          <button id="btn-remove-pass" style="background-color: #ff4444; color: white; width: 100%">取消密码保护</button>
        </div>
      </div>

      <div class="modal-actions">
        <button id="settings-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- Modal for Unlock -->
  <div id="unlock-modal" class="modal hidden" style="z-index: 2000;">
    <div class="modal-content">
      <h3>解锁数据库</h3>
      <p style="font-size: 0.9em; color: var(--text-color);">请输入主密码以访问数据。</p>

      <input type="password" id="unlock-password" placeholder="主密码" />

      <div class="modal-actions">
        <button id="btn-unlock" class="primary">解锁</button>
      </div>
    </div>
  </div>

  <!-- Modal for Set/Change Password input -->
  <div id="pass-input-modal" class="modal hidden" style="z-index: 1500;">
    <div class="modal-content">
      <h3 id="pass-input-title">设置密码</h3>
      <label>输入新密码</label>
      <div class="password-input-group">
        <input type="password" id="new-pass-1" />
        <button type="button" class="action-btn" id="toggle-new-pass-1"><img
            src="assets/solar--eye-outline.svg"></button>
      </div>
      <label>确认新密码</label>
      <div class="password-input-group">
        <input type="password" id="new-pass-2" />
      </div>

      <div class="modal-actions">
        <button id="pass-input-cancel">取消</button>
        <button id="pass-input-save" class="primary">确定</button>
      </div>
    </div>
  </div>
  <div id="confirm-modal" class="modal hidden" style="z-index: 3000;">
    <div class="modal-content" style="width: 300px;">
      <h3 id="confirm-title">确认</h3>
      <p id="confirm-message" style="margin: 15px 0; color: var(--text-color);">Are you sure?</p>
      <div class="modal-actions">
        <button id="confirm-cancel">取消</button>
        <button id="confirm-ok" class="primary" style="background-color: #ff4444;">确定</button>
      </div>
    </div>
  </div>
</body>

</html>
